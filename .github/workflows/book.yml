# Build the book, and publish it to GitHub Pages, every time main is pushed.
#
# One-time setup: in the repository's Settings > Pages, set the source to "GitHub Actions".
name: Publish the book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # mdbook and its plugins are Rust programs.  Building them takes a while, so the result is
      # kept between runs.  Change the key when a version changes.
      - uses: dtolnay/rust-toolchain@stable
      - id: tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: mdbook-tools-0.4.40-1.18.0-0.9.0-0.13.0-nozero
      - if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked mdbook --version 0.4.40
          cargo install --locked mdbook-admonish --version 1.18.0
          cargo install --locked mdbook-katex --version 0.9.0
          cargo install --locked mdbook-mermaid --version 0.13.0

      - run: npm ci

      # Stop before publishing if the code doesn't type-check, or the book doesn't build
      - run: npm run check
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
