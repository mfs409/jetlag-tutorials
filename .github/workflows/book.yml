# Build the book, and publish it to the gh-pages branch, every time main is pushed.
#
# One-time setup: in the repository's Settings > Pages, set the source to "Deploy from a branch",
# and pick the gh-pages branch (it is created by the first successful run of this workflow).
name: Publish the book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jetlag-tutorials

      # The book imports the engine from a peer folder, `../jetlag-main`.  Once package.json
      # points at a released version of jetlag2d, delete this step, and the two `jetlag-main` lines below.
      - uses: actions/checkout@v4
        with:
          repository: mfs409/jetlag
          ref: main
          path: jetlag-main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # mdbook and its plugins are Rust programs.  Building them takes a while, so the result is
      # kept between runs.  Change the key when a version changes.
      - uses: dtolnay/rust-toolchain@stable
      - id: tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: mdbook-tools-0.4.40-1.18.0-0.9.0-0.13.0-nozero
      - if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked mdbook --version 0.4.40
          cargo install --locked mdbook-admonish --version 1.18.0
          cargo install --locked mdbook-katex --version 0.9.0
          cargo install --locked mdbook-mermaid --version 0.13.0

      - run: npm install
        working-directory: jetlag-main
      - run: npm install
        working-directory: jetlag-tutorials

      # Stop before publishing if the code doesn't type-check, or the book doesn't build
      - run: npm run check
        working-directory: jetlag-tutorials
      - run: npm run build
        working-directory: jetlag-tutorials

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: jetlag-tutorials/book
