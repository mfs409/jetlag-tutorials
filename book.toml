[book]
authors = ["Michael Spear"]
language = "en"
multilingual = false
title = "The JetLag Book"

[output.html]
additional-css = ["./assets-web/mdbook-admonish.css", "./assets-web/jetlag.css"]
additional-js = ["./assets-web/mermaid.min.js", "./assets-web/mermaid-init.js", "./assets-web/kofi.js", "./assets-web/arcade-frame.js", "./assets-web/terminal-code.js", "./assets-web/terminal-video.js"]
print.enable = false
no-section-label = true

[preprocessor.katex]
after = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2"
