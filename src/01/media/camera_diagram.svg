<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="camClip">
      <rect x="430" y="90" width="220" height="140" />
    </clipPath>
  </defs>

  <!-- Reusable world content: sky, hills, actors -->
  <g id="worldContent">
    <rect x="40" y="40" width="760" height="300" fill="#eef2f6" />
    <path d="M40,300
             L40,260
             Q110,210 180,255
             Q250,300 320,235
             Q390,175 460,240
             Q530,290 610,250
             Q690,205 760,260
             L800,260
             L800,300 Z"
          fill="#3f9142" />
    <circle cx="230" cy="150" r="16" fill="#c0392b" />
    <circle cx="520" cy="140" r="16" fill="#000000" />
    <circle cx="700" cy="120" r="16" fill="#c0392b" />
  </g>

  <!-- The world, in place -->
  <use href="#worldContent" />
  <rect x="40" y="40" width="760" height="300" fill="none" stroke="#c0392b" stroke-width="4" />
  <text x="52" y="66" font-size="24" font-weight="bold" fill="#c0392b">World</text>

  <!-- The camera's viewport, drawn over the world -->
  <rect x="430" y="90" width="220" height="140" fill="#ffffff" fill-opacity="0.12"
        stroke="#8e44ad" stroke-width="4" stroke-dasharray="10 6" />
  <text x="438" y="112" font-size="22" font-weight="bold" fill="#8e44ad">Camera</text>

  <!-- Projection lines from the camera rectangle to the on-screen panel -->
  <g stroke="#2d6cdf" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round">
    <line x1="430" y1="90"  x2="255" y2="400" />
    <line x1="650" y1="90"  x2="585" y2="400" />
    <line x1="430" y1="230" x2="255" y2="610" />
    <line x1="650" y1="230" x2="585" y2="610" />
  </g>

  <!-- What the player actually sees: the camera rectangle, magnified to fill the screen -->
  <text x="420" y="376" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">What the player sees</text>
  <g transform="translate(255,400) scale(1.5) translate(-430,-90)">
    <g clip-path="url(#camClip)">
      <use href="#worldContent" />
    </g>
  </g>
  <rect x="255" y="400" width="330" height="210" fill="none" stroke="#8e44ad" stroke-width="4" />

  <!-- A little monitor stand, purely decorative, to read as "the screen" -->
  <rect x="400" y="610" width="40" height="14" fill="#888" />
  <rect x="370" y="624" width="100" height="10" rx="4" fill="#888" />
</svg>
